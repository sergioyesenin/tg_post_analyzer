name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    name: Backend and Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      TG_API_ID: "123456"
      TG_API_HASH: test_api_hash
      AUTH_JWT_SECRET: TestJwtSecretValue_WithEnoughEntropy_123!
      AUTH_PROVIDER_MODE: local
      DB_URL: postgresql+asyncpg://ci:ci-password@localhost:5432/tg_post_analyzer_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-base.txt
            requirements-ai.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest -q tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test
