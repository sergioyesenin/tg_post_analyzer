x-app-image: &app-image
  image: tg_post_analyzer:latest
  build:
    context: .
    dockerfile: Dockerfile

services:
  redis:
    image: redis:alpine
    container_name: redis-searxng
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - redis-data:/data
  postgres:
    image: postgres:16
    container_name: tg_analytics_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    <<: *app-image
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DB_URL: ${DOCKER_DB_URL:-postgresql+asyncpg://tg_analytics_app:replace-with-url-encoded-password@postgres:5432/tg_analytics}
      TEST_DATABASE_URL: ${DOCKER_TEST_DATABASE_URL:-postgresql+asyncpg://tg_analytics_app:replace-with-url-encoded-password@postgres:5432/tg_analytics_test}
      REPORT_LLM_BASE_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - alembic
      - upgrade
      - heads

  api:
    <<: *app-image
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      DB_URL: ${DOCKER_DB_URL:-postgresql+asyncpg://tg_analytics:replace-with-url-encoded-password@postgres:5432/tg_analytics}
      TEST_DATABASE_URL: ${DOCKER_TEST_DATABASE_URL:-postgresql+asyncpg://tg_analytics:replace-with-url-encoded-password@postgres:5432/tg_analytics_test}
      REPORT_LLM_BASE_URL: http://ollama:11434
    depends_on:
      ollama: 
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8044:8044"
    command:
      - python
      - scripts/run_api.py
      - --host
      - 0.0.0.0
      - --port
      - "8044"

  scheduler:
    <<: *app-image
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      DB_URL: ${DOCKER_DB_URL:-postgresql+asyncpg://tg_analytics_app:replace-with-url-encoded-password@postgres:5432/tg_analytics}
      TEST_DATABASE_URL: ${DOCKER_TEST_DATABASE_URL:-postgresql+asyncpg://tg_analytics_app:replace-with-url-encoded-password@postgres:5432/tg_analytics_test}
      REPORT_LLM_BASE_URL: http://ollama:11434
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - python
      - scripts/run_scheduler.py
    volumes:
      - ./services:/app/services

  telegram_pipeline:
    <<: *app-image
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
     - .env
    environment:
      DB_URL: ${DOCKER_DB_URL:-postgresql+asyncpg://tg_analytics_app:replace-with-url-encoded-password@postgres:5432/tg_analytics}
      TEST_DATABASE_URL: ${DOCKER_TEST_DATABASE_URL:-postgresql+asyncpg://tg_analytics_app:replace-with-url-encoded-password@postgres:5432/tg_analytics_test}
      REPORT_LLM_BASE_URL: http://ollama:11434
      TG_SESSION_NAME: ${DOCKER_TG_SESSION_NAME:-/app/runtime/tg_analytics_new.session}
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama: 
        condition: service_healthy
    volumes:
      - tg_session:/app/runtime
    command:
      - python
      - scripts/run_telegram_pipeline.py
      - --daemon
      - --session-suffix
      - new

  ai_pipeline:
    <<: *app-image
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      DB_URL: ${DOCKER_DB_URL:-postgresql+asyncpg://tg_analytics_app:replace-with-url-encoded-password@postgres:5432/tg_analytics}
      TEST_DATABASE_URL: ${DOCKER_TEST_DATABASE_URL:-postgresql+asyncpg://tg_analytics_app:replace-with-url-encoded-password@postgres:5432/tg_analytics_test}
      REPORT_LLM_BASE_URL: http://ollama:11434
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama: 
        condition: service_healthy
    command:
      - python
      - scripts/run_ai_pipeline.py
      - --daemon
      - --skip-db-migrations
      
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8088:8080"              # хост:контейнер (8088 на хосте)
    environment:
      - BASE_URL=http://localhost:8088/
      - INSTANCE_NAME=reporting-retrieval
      - SEARXNG_REDIS_URL=redis://redis:6379/0  
      - SEARXNG_SECRET=${SEARXNG_SECRET} # подключение к Redis
    volumes:
      - ./searxng:/etc/searxng
    restart: unless-stopped
    depends_on:
      - redis

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - default
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
  redis-data:
  tg_session:
  ollama_data:

