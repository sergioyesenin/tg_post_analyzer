# /etc/searxng/limiter.toml

[botdetection.ip_limit]
# Включаем link_token для дополнительной проверки (снижает риск бот-детекта)
link_token = true          # ИЗМЕНЕНО: было false
filter_link_local = true   # ИЗМЕНЕНО: было false, лучше фильтровать локальные IP

[botdetection.ip_lists]
pass_ip = [
    "127.0.0.1",
    "::1",
    "172.19.0.1"
]