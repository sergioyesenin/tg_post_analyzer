use_default_settings: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "change-this-secret-key"
  limiter: true
  image_proxy: false
  public_instance: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "ru"
  formats:
    - html
    - json

ui:
  static_use_hash: true

outgoing:
  request_timeout: 8.0

botdetection:
  ip_limit:
    filter_link_local: false
    link_token: false
  ip_lists:
    pass_ip:
      - 127.0.0.1
      - ::1

# Reverse proxy / forwarded headers
# Prevent X-Forwarded-For/X-Real-IP warnings behind proxy.
http:
  real_ip:
    x_for: 1

engines:
  # Disabled due to recurring init/runtime failures/noise in logs.
  - name: wikidata
    disabled: true
  - name: brave
    disabled: true
  - name: karmasearch
    disabled: true
  - name: karmasearch videos
    disabled: true
