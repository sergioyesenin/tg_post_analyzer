generate_mini_report:
  description: >
    Сгенерировать аналитический мини-отчет по одному посту Telegram на основе комментариев.
    Использовать только переданные данные. Если комментариев меньше порога — вернуть
    статус "SKIPPED_MIN_COMMENTS" и короткую причину.
  expected_output: >
    Структурированный текст на русском, 200–500 слов (конфигурируемо), со следующими разделами:
    1) Контекст поста (1–2 предложения)
    2) Общий тон обсуждения + процентное распределение тональностей
    3) Ключевые темы (3–7 пунктов)
    4) Тренды/паттерны (2–5 пунктов)
    5) Репрезентативные цитаты (3–5 коротких, без usernames)
    6) Классификация комментариев: по тональности + по темам (краткие итоги)
    7) Риски/сигналы (если есть): поляризация, координация, повторяемость тезисов (без категоричных выводов)
  agent: comment_analyst

  # Входные данные (подставляй при формировании промпта из БД)
  # Пример: crew.kickoff(inputs={...})
  input_schema:
    post:
      channel: "{{channel}}"
      post_id: "{{post_id}}"
      published_at: "{{published_at}}"
      text: "{{post_text}}"
      views: "{{views}}"
      media_links: "{{media_links}}"
    comments:
      total: "{{comments_total}}"
      items: "{{comments_items}}"
    config:
      min_comments: "{{min_comments}}"
      report_word_target: "{{report_word_target}}"
      report_word_min: "{{report_word_min}}"
      report_word_max: "{{report_word_max}}"

  # Шаблон инструкции (ядро промпта задачи)
  prompt: |
    Ты анализируешь комментарии к одному посту Telegram и формируешь мини-отчет.

    ВАЖНО:
    - Язык: русский.
    - Если comments.total < config.min_comments:
        выведи ровно:
        STATUS: SKIPPED_MIN_COMMENTS
        REASON: недостаточно комментариев для анализа (укажи число)
      и больше ничего.
    - Длина отчета: от config.report_word_min до config.report_word_max слов
      (ориентируйся на config.report_word_target).
    - Комментарии могут быть короткими, со сленгом, эмодзи, RU/EN.
    - Не выводи usernames/ID авторов. Цитаты — короткие, без персональных данных.
    - Проценты тональностей должны суммироваться до 100% (допускается округление).

    ДАННЫЕ ПО ПОСТУ:
    Канал: {{post.channel}}
    Post ID: {{post.post_id}}
    Время публикации: {{post.published_at}}
    Просмотры: {{post.views}}
    Текст поста:
    ---
    {{post.text}}
    ---
    Медиа-ссылки: {{post.media_links}}

    КОММЕНТАРИИ ({{comments.total}} шт.):
    ---
    {{comments.items}}
    ---

    Сформируй отчет строго в формате:

    Заголовок: <короткий заголовок по сути обсуждения>

    1) Контекст поста
    <1–2 предложения>

    2) Общий тон обсуждения
    - Итог: <позитивный/негативный/нейтральный/смешанный>
    - Распределение: позитив X% / негатив Y% / нейтрал Z% / смешанный W%
    - Обоснование: <2–4 предложения>

    3) Ключевые темы
    - Тема 1: <кратко>
    - ...
    (3–7 пунктов)

    4) Тренды и повторяющиеся паттерны
    - <паттерн 1>
    - ...
    (2–5 пунктов)

    5) Репрезентативные цитаты
    - "..."
    - "..."
    (3–5 цитат)

    6) Классификация комментариев
    - По тональности: <кратко, что характерно для каждой группы>
    - По темам: <2–5 тематических кластеров и их краткое описание>

    7) Риски/сигналы (если применимо)
    - <наблюдение 1>
    - <наблюдение 2>

  # Параметры выполнения/валидации на уровне задачи
  runtime:
    max_retries: 1
    timeout_sec: 10
